  # --- universities and institutes ---
  - {id: ucsd, kind: university, name: UC San Diego, url: "https://ucsd.edu", description: "University of California San Diego."}
  - {id: radboud-university, kind: university, name: Radboud University, url: "https://www.ru.nl", description: "Nijmegen, the Netherlands."}
  - {id: stanford, kind: university, name: Stanford University, url: "https://www.stanford.edu", description: "Stanford, California."}
  - {id: temple-university, kind: university, name: Temple University, url: "https://www.temple.edu", description: "Philadelphia, Pennsylvania."}
