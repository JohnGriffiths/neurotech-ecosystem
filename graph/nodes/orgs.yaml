  - {id: nwb-community, kind: standards_body, name: Neurodata Without Borders, url: "https://www.nwb.org",
     description: "Maintains the NWB standard and core software."}
  - {id: sfnirs, kind: standards_body, name: Society for fNIRS, url: "https://fnirs.org",
