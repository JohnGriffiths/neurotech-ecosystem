  - {id: medtronic, kind: company, name: Medtronic, url: "https://www.medtronic.com",
     description: "Medical device maker; DBS and other neuromodulation systems."}
  - {id: abbott, kind: company, name: Abbott, url: "https://www.abbott.com",
