defaults: {type: tech}
nodes:
  # --- standards and formats ---
  - {id: bids, kind: standard, layer: standard, name: Brain Imaging Data Structure (BIDS), url: "https://bids.neuroimaging.io",
     description: "Standard for organising neuroimaging and electrophysiology datasets."}
  - {id: nwb, kind: standard, layer: standard, name: Neurodata Without Borders (NWB), url: "https://www.nwb.org",
     description: "Data standard for neurophysiology."}
  - {id: snirf, kind: standard, layer: standard, name: SNIRF, url: "https://github.com/fNIRS/snirf",
     description: "Shared Near Infrared Spectroscopy Format."}
  - {id: xdf, kind: standard, layer: standard, name: XDF, url: "https://github.com/sccn/xdf",
     description: "Container format for multi-stream recordings, used by LSL LabRecorder."}
  - {id: edf, kind: standard, layer: standard, name: EDF / EDF+, url: "https://www.edfplus.info",
     description: "European Data Format for biosignal recordings."}

  # --- archives ---
  - {id: openneuro, kind: dataset, layer: data, name: OpenNeuro, url: "https://openneuro.org",
     description: "Open archive of BIDS-formatted neuroimaging datasets."}
  - {id: nemar, kind: dataset, layer: data, name: NEMAR, url: "https://nemar.org",
     description: "Gateway to OpenNeuro EEG, MEG and iEEG data with compute access."}
  - {id: dandi-archive, kind: dataset, layer: data, name: DANDI Archive, url: "https://dandiarchive.org",
     description: "Archive for cellular neurophysiology data in NWB."}
  - {id: physionet, kind: dataset, layer: data, name: PhysioNet, url: "https://physionet.org",
     description: "Repository of physiological signal datasets."}

  # --- datasets ---
  - {id: tuh-eeg, kind: dataset, layer: data, name: TUH EEG Corpus, url: "https://isip.piconepress.com/projects/nedc/html/tuh_eeg/",
     description: "Large corpus of clinical EEG recordings."}
  - {id: eegmmidb, kind: dataset, layer: data, name: EEG Motor Movement/Imagery Dataset, url: "https://physionet.org/content/eegmmidb/",
     description: "109-subject motor execution and imagery EEG dataset."}
  - {id: sleep-edf, kind: dataset, layer: data, name: Sleep-EDF Expanded, url: "https://physionet.org/content/sleep-edfx/",
     description: "Whole-night polysomnography recordings with hypnograms."}
  - {id: bci-competition-iv, kind: dataset, layer: data, name: BCI Competition IV datasets, url: "https://www.bbci.de/competition/iv/",
     description: "Widely used motor imagery benchmark datasets."}
  - {id: hbn-eeg, kind: dataset, layer: data, name: Healthy Brain Network EEG,
     description: "Large developmental high-density EEG dataset."}
