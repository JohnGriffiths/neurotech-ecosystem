defaults: {type: tech, kind: software}
nodes:
  # --- acquisition ---
  - {id: brainflow, layer: acquisition, name: BrainFlow, url: "https://github.com/brainflow-dev/brainflow",
     description: "Uniform acquisition API across many biosensor boards."}
  - {id: openbci-gui, layer: acquisition, name: OpenBCI GUI, url: "https://github.com/OpenBCI/OpenBCI_GUI",
     description: "Desktop application for streaming and visualising OpenBCI data."}
  - {id: explorepy, layer: acquisition, name: explorepy, url: "https://github.com/Mentalab-hub/explorepy",
     description: "Python API for Mentalab Explore devices."}
  - {id: neurosity-sdk, layer: acquisition, name: Neurosity SDK, url: "https://github.com/neurosity/neurosity-sdk-js",
     description: "JavaScript SDK for the Neurosity Crown."}
  - {id: emotiv-cortex, layer: acquisition, name: EMOTIV Cortex API, url: "https://emotiv.gitbook.io/cortex-api",
     description: "Proprietary API for EMOTIV headsets."}
  - {id: muse-js, layer: acquisition, name: muse-js, url: "https://github.com/urish/muse-js",
     description: "Web Bluetooth client for Muse headbands."}
  - {id: open-ephys-gui, layer: acquisition, name: Open Ephys GUI, url: "https://github.com/open-ephys/plugin-GUI",
     description: "Plugin-based acquisition software for extracellular electrophysiology."}

  # --- streaming ---
  - {id: liblsl, layer: streaming, name: Lab Streaming Layer (liblsl), url: "https://github.com/sccn/liblsl",
     description: "Time-synchronised streaming of measurement time series over a network."}
  - {id: pylsl, layer: streaming, name: pylsl, url: "https://github.com/labstreaminglayer/pylsl",
     description: "Python bindings for liblsl."}
  - {id: muselsl, layer: streaming, name: muselsl, url: "https://github.com/alexandrebarachant/muse-lsl",
     description: "Streams Muse headband data to LSL."}
  - {id: bluemuse, layer: streaming, name: BlueMuse, url: "https://github.com/kowalej/BlueMuse",
     description: "Windows application streaming Muse data to LSL."}
  - {id: mne-lsl, layer: streaming, name: MNE-LSL, url: "https://github.com/mne-tools/mne-lsl",
     description: "Real-time framework integrating MNE-Python with LSL."}
  - {id: timeflux, layer: streaming, name: Timeflux, url: "https://github.com/timeflux/timeflux",
     description: "Python framework for real-time biosignal pipelines and BCIs."}
  - {id: openvibe, layer: streaming, name: OpenViBE, url: "http://openvibe.inria.fr",
     description: "Graphical platform for designing and running BCIs."}
  - {id: bci2000, layer: streaming, name: BCI2000, url: "https://www.bci2000.org",
     description: "General-purpose BCI research software suite."}

  # --- processing ---
  - {id: mne-python, layer: processing, name: MNE-Python, url: "https://github.com/mne-tools/mne-python",
     description: "Analysis and visualisation of MEG, EEG, sEEG, ECoG and fNIRS data."}
  - {id: mne-bids, layer: processing, name: MNE-BIDS, url: "https://github.com/mne-tools/mne-bids",
     description: "Read and write BIDS datasets with MNE-Python."}
  - {id: mne-nirs, layer: processing, name: MNE-NIRS, url: "https://github.com/mne-tools/mne-nirs",
     description: "fNIRS analysis built on MNE-Python."}
  - {id: autoreject, layer: processing, name: autoreject, url: "https://github.com/autoreject/autoreject",
     description: "Automated rejection and repair of bad EEG/MEG epochs."}
  - {id: pyxdf, layer: processing, name: pyxdf, url: "https://github.com/xdf-modules/pyxdf",
     description: "Python reader for XDF files."}
  - {id: eeglab, layer: processing, name: EEGLAB, url: "https://github.com/sccn/eeglab",
     description: "MATLAB toolbox for EEG analysis."}
  - {id: fieldtrip, layer: processing, name: FieldTrip, url: "https://github.com/fieldtrip/fieldtrip",
     description: "MATLAB toolbox for MEG, EEG and iEEG analysis."}
  - {id: yasa, layer: processing, name: YASA, url: "https://github.com/raphaelvallat/yasa",
     description: "Sleep analysis toolbox with automatic sleep staging."}
  - {id: spikeinterface, layer: processing, name: SpikeInterface, url: "https://github.com/SpikeInterface/spikeinterface",
     description: "Unified framework for spike sorting."}
  - {id: kilosort, layer: processing, name: Kilosort, url: "https://github.com/MouseLand/Kilosort",
     description: "Spike sorting for high-density probes."}
  - {id: neuroconv, layer: processing, name: NeuroConv, url: "https://github.com/catalystneuro/neuroconv",
     description: "Converts neurophysiology data from many formats to NWB."}
  - {id: pynwb, layer: processing, name: PyNWB, url: "https://github.com/NeurodataWithoutBorders/pynwb",
     description: "Python API for reading and writing NWB files."}

  # --- machine learning and benchmarking ---
  - {id: moabb, layer: ml, name: MOABB, url: "https://github.com/NeuroTechX/moabb",
     description: "Mother of All BCI Benchmarks; reproducible benchmarking of BCI algorithms on open datasets."}
  - {id: braindecode, layer: ml, name: Braindecode, url: "https://github.com/braindecode/braindecode",
     description: "Deep learning toolbox for decoding raw electrophysiology data."}
  - {id: pyriemann, layer: ml, name: pyRiemann, url: "https://github.com/pyRiemann/pyRiemann",
     description: "Riemannian-geometry machine learning for multivariate biosignals."}

  # --- experiment ---
  - {id: eeg-expy, layer: experiment, name: EEG-ExPy, url: "https://github.com/NeuroTechX/EEG-ExPy",
     description: "Classic EEG experiments on consumer hardware (formerly eeg-notebooks)."}
  - {id: psychopy, layer: experiment, name: PsychoPy, url: "https://github.com/psychopy/psychopy",
     description: "Stimulus presentation and experiment control."}

  # --- proposed (does not exist yet) ---
  - {id: device-descriptor-registry, kind: standard, layer: standard, status: proposed, name: Open device descriptor registry,
     description: "Machine-readable registry of biosensing devices: channels, electrode positions, sampling rates, reference scheme and transport."}
