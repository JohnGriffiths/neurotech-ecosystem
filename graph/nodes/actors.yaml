defaults: {type: actor}
nodes:
  # --- companies ---
  - {id: openbci, kind: company, name: OpenBCI, url: "https://openbci.com",
     description: "Open-hardware biosensing boards and headsets."}
  - {id: interaxon, kind: company, name: InteraXon (Muse), url: "https://choosemuse.com",
     description: "Consumer EEG headbands for meditation and sleep."}
  - {id: emotiv, kind: company, name: EMOTIV, url: "https://www.emotiv.com",
     description: "Consumer and research wireless EEG headsets."}
  - {id: neurosity, kind: company, name: Neurosity, url: "https://neurosity.co",
     description: "Maker of the Crown EEG headset with on-device compute."}
  - {id: gtec, kind: company, name: g.tec medical engineering, url: "https://www.gtec.at",
     description: "Research and clinical BCI hardware; makes the Unicorn Hybrid Black."}
  - {id: mentalab, kind: company, name: Mentalab, url: "https://mentalab.com",
     description: "Mobile ExG amplifiers for research."}
  - {id: pieeg, kind: company, name: PiEEG, url: "https://pieeg.com",
     description: "Low-cost EEG shields for Raspberry Pi."}
  - {id: upside-down-labs, kind: company, name: Upside Down Labs, url: "https://upsidedownlabs.tech",
     description: "Low-cost open-hardware biopotential sensors."}
  - {id: kernel, kind: company, name: Kernel, url: "https://www.kernel.com",
     description: "Maker of the Flow time-domain fNIRS headset."}
  - {id: imec, kind: company, name: imec, url: "https://www.neuropixels.org",
     description: "Research institute that fabricates Neuropixels probes."}
  - {id: catalystneuro, kind: company, name: CatalystNeuro, url: "https://www.catalystneuro.com",
     description: "Consultancy building neurophysiology data standardisation tools."}

  # --- labs and institutes ---
  - {id: sccn, kind: lab, name: Swartz Center for Computational Neuroscience (UCSD), url: "https://sccn.ucsd.edu",
     description: "Home of EEGLAB, Lab Streaming Layer and NEMAR."}
  - {id: donders, kind: lab, name: Donders Institute, url: "https://www.ru.nl/donders",
     description: "Home of the FieldTrip toolbox."}
  - {id: inria, kind: lab, name: Inria, url: "https://www.inria.fr",
     description: "French research institute; home of OpenViBE."}
  - {id: ncan, kind: lab, name: National Center for Adaptive Neurotechnologies, url: "https://www.neurotechcenter.org",
     description: "Stewards of BCI2000."}
  - {id: temple-nedc, kind: lab, name: Temple University NEDC, url: "https://isip.piconepress.com/projects/nedc/",
     description: "Neural Engineering Data Consortium; publishes the TUH EEG Corpus."}
  - {id: mit-lcp, kind: lab, name: MIT Laboratory for Computational Physiology, url: "https://physionet.org",
     description: "Operates PhysioNet."}
  - {id: child-mind-institute, kind: lab, name: Child Mind Institute, url: "https://childmind.org",
     description: "Runs the Healthy Brain Network data collection."}
  - {id: poldrack-lab, kind: lab, name: Poldrack Lab (Stanford), url: "https://poldracklab.org",
     description: "Operates OpenNeuro."}

  # --- open-source maintainer groups ---
  - {id: mne-tools, kind: maintainer, name: MNE developers, url: "https://github.com/mne-tools",
     description: "Maintainers of MNE-Python and its satellite packages."}
  - {id: brainflow-dev, kind: maintainer, name: BrainFlow developers, url: "https://github.com/brainflow-dev",
     description: "Maintainers of the BrainFlow acquisition library."}
  - {id: braindecode-dev, kind: maintainer, name: Braindecode developers, url: "https://github.com/braindecode",
     description: "Maintainers of Braindecode."}
  - {id: pyriemann-dev, kind: maintainer, name: pyRiemann developers, url: "https://github.com/pyRiemann",
     description: "Maintainers of pyRiemann."}
  - {id: spikeinterface-dev, kind: maintainer, name: SpikeInterface developers, url: "https://github.com/SpikeInterface",
     description: "Maintainers of SpikeInterface."}
  - {id: open-ephys, kind: maintainer, name: Open Ephys, url: "https://open-ephys.org",
     description: "Non-profit producing open-source electrophysiology hardware and software."}
  - {id: timeflux-dev, kind: maintainer, name: Timeflux developers, url: "https://github.com/timeflux",
     description: "Maintainers of Timeflux."}
  - {id: open-science-tools, kind: maintainer, name: Open Science Tools, url: "https://opensciencetools.org",
     description: "Maintainers of PsychoPy."}

  # --- communities and standards bodies ---
  - {id: neurotechx, kind: community, name: NeuroTechX, url: "https://neurotechx.com",
     description: "International neurotechnology enthusiast community."}
  - {id: bids-community, kind: standards_body, name: BIDS community, url: "https://bids.neuroimaging.io",
     description: "Maintains the Brain Imaging Data Structure specification."}
  - {id: nwb-community, kind: standards_body, name: Neurodata Without Borders, url: "https://www.nwb.org",
     description: "Maintains the NWB standard and core software."}
  - {id: sfnirs, kind: standards_body, name: Society for fNIRS, url: "https://fnirs.org",
     description: "Stewards the SNIRF file format."}
  - {id: dandi-team, kind: maintainer, name: DANDI team, url: "https://dandiarchive.org",
     description: "Operates the DANDI neurophysiology archive."}
