# Size of organisations: employees, total funding raised, and annual revenue.
#
# Gathered by web search in November 2026 from the sources named on each line. Nothing here was read from
# a primary filing directly: public companies' figures come from search results that quote their annual
# reports or press releases, and private companies' figures from aggregators (Dealroom, PitchBook, CB
# Insights, Revelio, Growjo and similar) that often disagree with each other.
#
# Each metric is either `value` or a `low` / `high` range, plus:
#   quality   reported  the company's own figure as quoted by a secondary source
#             estimate  a third-party aggregator's estimate, or a range across several that disagree
#   as_of     when the figure applies (not when it was looked up)
#   source    a URL; `note` carries anything a reader should know
#   currency  for money, if not USD (converted at fixed approximate rates for tiers and sizing only)
# Where sources conflict the range spans them. Where they conflicted too badly, or none was found, the
# metric is simply left out: most organisations have no entry, and "unknown" is the normal state.
metrics:
  # ---------------------------------------------------------------- large public companies
  medtronic:
    employees: {value: 95000, as_of: "2025-04", quality: reported, source: "https://stockanalysis.com/stocks/mdt/employees/", note: "As of 25 April 2025, from the SEC filing as quoted by StockAnalysis. Revelio estimates 95,670."}
